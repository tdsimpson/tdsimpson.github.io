<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200" />
    <meta name="robots" content="noindex">
    <title>OG card export</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@400..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #f7f7f7;
        }

        .og-card {
            container-type: inline-size;
            width: 1200px;
            height: 630px;
            display: grid;
            grid-template-columns: 1.12fr 0.88fr;
            background: #f7f7f7;
            color: #161616;
            font-family: "DM Sans", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .og-copy {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8.4cqw 7.2cqw;
            min-width: 0;
        }

        .og-kicker {
            margin: 0 0 2.2cqw;
            font-size: 1.7cqw;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #6a6a64;
        }

        .og-copy h1 {
            font-family: "Schibsted Grotesk", system-ui, sans-serif;
            font-size: 7.1cqw;
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 0.95;
            margin: 0 0 2.4cqw;
        }

        .og-line {
            margin: 0;
            font-size: 2.15cqw;
            line-height: 1.35;
            max-width: 28ch;
            color: #6a6a64;
        }

        .og-url {
            margin: 0;
            font-size: 1.75cqw;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #6a6a64;
        }

        .og-photo {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            margin: 4.6cqw 4.6cqw 4.6cqw 1.2cqw;
            border-radius: 1.7cqw;
        }

        .og-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 18%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="og-card">
        <div class="og-copy">
            <div>
                <p class="og-kicker">Product manager &amp; designer</p>
                <h1>Taylor Simpson</h1>
                <p class="og-line">I turn messy problems into products (and stories) that make sense.</p>
            </div>
            <p class="og-url">taylorsimpson.ca</p>
        </div>
        <div class="og-photo">
            <img src="images/portrait.png" alt="">
        </div>
    </div>
</body>

</html>
