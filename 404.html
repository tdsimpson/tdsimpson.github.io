<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { }
        })();
    </script>
    <style>
        html {
            background: #ffffff;
            color: #0f172a;
        }

        html[data-theme="dark"] {
            background: #0f1412;
            color: #e8ede9;
        }
    </style>
    <title>Page not found | Taylor Simpson</title>
    <meta name="description" content="Page not found. Head back to Taylor Simpson’s portfolio." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@400..900&display=swap"
        rel="stylesheet">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
    <style>
        :root {
            --bg: #ffffff;
            --muted: #6b7280;
            --text: #0f172a;
            --accent-2: #2d2d2d;
            --font-display: "Schibsted Grotesk", system-ui, sans-serif;
            --font-body: "DM Sans", system-ui, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0f1412;
            --muted: #8a9a92;
            --text: #e8ede9;
            --accent-2: #2d2d2d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .logo,
        h1,
        .btn {
            font-family: var(--font-display);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 36px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 24px;
        }

        .logo {
            font-weight: 800;
            letter-spacing: -0.02em;
            font-size: 18px;
        }

        .theme-toggle {
            border-radius: 999px;
            padding: 8px;
            border: 1px solid rgba(15, 23, 42, 0.04);
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        [data-theme="dark"] .theme-toggle {
            border-color: rgba(255, 255, 255, 0.03);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px 0 80px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 2.75rem);
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin: 0 0 28px;
            font-weight: 800;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: 0;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            width: fit-content;
        }

        .btn-primary {
            background: var(--accent-2);
            color: #fff;
        }

        footer {
            padding: 24px 0 8px;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <a href="/" class="logo">Taylor Simpson</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">🌓</button>
        </header>

        <main>
            <h1>Page not found</h1>
            <a class="btn btn-primary" href="/">Back to portfolio</a>
        </main>

        <footer>© Taylor Simpson</footer>
    </div>

    <script>
        const toggle = document.getElementById('themeToggle');
        const root = document.documentElement;

        function setTheme(t) {
            root.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
        }

        toggle.addEventListener('click', () =>
            setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light')
        );
    </script>
</body>

</html>
